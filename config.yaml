nox:
  name: "Nox"
  language: "pt-PT"
  persona: "calm, direct, helpful, futuristic"
  wake_word: "hey nox"
  wake_word_sensitivity: 0.7
  voice_enabled: true
  text_enabled: true
  voice_fillers: true

wake:
  provider: "vosk"
  model: "vosk-model-small-pt-0.3"
  phrases:
    - "nox"
    - "ei nox"
    - "hey nox"
  grammar:
    - "inox"
    - "ei inox"
    - "[unk]"
  voiceprint: false
  voiceprint_threshold: 0.35
  timeout_s: 8
  follow_up_s: 6

audio:
  input_device: "default"
  sample_rate: 16000
  channels: 1
  block_ms: 30
  min_speech_rms: 120
  noise_gate: true
  noise_gate_factor: 2.5
  denoise_wake: false
  barge_in: false
  barge_in_ms: 300
  barge_in_threshold: 800
  vad:
    provider: "webrtc"
    sensitivity: 0.5
    aggressiveness: 2
    silence_ms: 500

stt:
  provider: "faster-whisper"
  model: "small"
  device: "auto"
  compute_type: "int8"
  beam_size: 3
  language: "pt"
  initial_prompt: ""
  trim_silence: true
  denoise: true
  denoise_strength: 1.5
  fallback_provider: "openai"

llm:
  default_provider: "selora"
  model: "claude-haiku-5-5"
  api_format: "anthropic"
  base_url: "https://api.selora.lol/v1"
  api_key_env: "NOX_LLM_API_KEY"
  max_tokens: 400
  temperature: 0.4
  timeout: 30
  router:
    simple_tasks: "groq"
    coding_tasks: "anthropic"
    private_tasks: "ollama"
    fallback: "openai_compatible"

tts:
  provider: "edge"
  voice: "pt-PT-DuarteNeural"
  speed: 1.0

memory:
  enabled: true
  sqlite_path: "data/nox.db"
  vector_store: "none"
  embedding_provider: "local"
  history_turns: 12

github:
  default_repo: "7lokii/HeyNox"
  default_branch: "main"
  allow_push_to_main: false
  require_pr: true
  require_tests: true

security:
  allowed_paths:
    - "./projects"
    - "./data"
  blocked_paths:
    - ".env"
    - ".git"
    - "credentials"
  allowed_commands:
    - "git status"
    - "git diff"
    - "pytest"
    - "python -m pytest"
  require_confirmation:
    - "delete"
    - "force_push"
    - "install"
    - "system_change"
    - "send_email"
    - "purchase"
