[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heynox"
version = "0.0.1"
description = "HeyNox — assistente pessoal de IA local-first com voz, wake word, memória e ferramentas seguras."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "7lokii" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6", "numpy>=1.26"]
wake = ["openwakeword>=0.6"]
vad = ["webrtcvad-wheels>=2.0"]
silero = ["silero-vad>=5.0", "torch>=2.2"]
stt = ["faster-whisper>=1.0"]
tts = ["piper-tts>=1.8"]
edge = ["edge-tts>=7.0"]
voice = [
    "heynox[audio,wake,vad,stt,tts,edge]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.360",
]

[project.scripts]
nox = "nox.main:main"

[project.urls]
Homepage = "https://github.com/7lokii/HeyNox"

[tool.hatch.build.targets.wheel]
packages = ["nox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"installer/pyinstaller.py" = ["S603"]

[tool.pyright]
include = ["nox", "tests", "installer"]
exclude = ["installer/*.spec"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
