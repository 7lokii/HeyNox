<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nox</title>
<style>
  :root {
    --bg: #04070d;
    --panel: rgba(9, 20, 31, 0.72);
    --line: rgba(34, 211, 238, 0.16);
    --line-strong: rgba(34, 211, 238, 0.38);
    --cyan: #22d3ee;
    --ink: #d9f6ff;
    --muted: #5b8497;
    --accent: var(--cyan);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(14, 116, 144, 0.18), transparent 60%),
      radial-gradient(900px 600px at 80% 110%, rgba(34, 211, 238, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 14px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  body[data-status="a falar"] { --accent: #67e8f9; }
  body[data-status="a pensar"] { --accent: #a5b4fc; }
  body[data-status="a ouvir"] { --accent: #34d399; }
  body[data-status="a aguardar palavra"] { --accent: #c084fc; }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 18px 22px 16px;
    gap: 14px;
  }

  /* ---------- topo ---------- */
  .topbar { display: flex; align-items: center; gap: 18px; }
  .brand {
    font-size: 15px;
    letter-spacing: 0.42em;
    font-weight: 600;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(34, 211, 238, 0.45);
  }
  .brand .mark { opacity: .55; margin-right: 8px; }
  .clock {
    font-family: Consolas, "SF Mono", monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.14em;
  }
  .status {
    margin-left: 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    font-family: Consolas, "SF Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .status i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .emergency {
    margin-left: auto;
    padding: 6px 14px;
    border: 1px solid rgba(248, 113, 113, .55);
    border-radius: 999px;
    background: transparent;
    color: #f87171;
    font-family: Consolas, "SF Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .emergency:hover { background: rgba(248, 113, 113, .12); }
  .emergency[aria-pressed="true"] {
    background: rgba(248, 113, 113, .2);
    border-color: #f87171;
    color: #fecaca;
  }

  /* ---------- palco ---------- */
  .stage {
    display: grid;
    grid-template-columns: 1fr minmax(320px, 400px);
    gap: 18px;
    min-height: 0;
  }

  .reactor { position: relative; min-height: 0; }
  #spectrum { width: 100%; height: 100%; display: block; }
  .core {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .core-title {
    font-size: clamp(30px, 5vw, 54px);
    font-weight: 300;
    letter-spacing: 0.34em;
    padding-left: 0.34em;
    color: #eafcff;
    text-shadow: 0 0 26px rgba(34, 211, 238, .55), 0 0 70px rgba(34, 211, 238, .22);
  }
  .core-sub {
    margin-top: 10px;
    font-family: Consolas, "SF Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.34em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---------- painel lateral ---------- */
  .side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .panel-head {
    font-family: Consolas, "SF Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
    padding-left: 2px;
  }
  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
  .empty { margin: auto; color: var(--muted); text-align: center; font-size: 12px; letter-spacing: .04em; }
  .turn { display: flex; flex-direction: column; gap: 5px; }
  .who {
    font-family: Consolas, "SF Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .turn.user .who { color: #7dd3fc; }
  .turn.assistant .who { color: var(--accent); }
  .bubble {
    padding: 9px 12px;
    border-left: 1px solid var(--line-strong);
    background: linear-gradient(90deg, rgba(34, 211, 238, .07), transparent 70%);
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 13.5px;
  }
  .turn.user .bubble {
    border-left-color: rgba(125, 211, 252, .5);
    background: linear-gradient(90deg, rgba(125, 211, 252, .07), transparent 70%);
  }

  .memory {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    padding: 10px 14px;
  }
  .memory summary {
    cursor: pointer;
    list-style: none;
    font-family: Consolas, "SF Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .memory summary::-webkit-details-marker { display: none; }
  #memcount {
    padding: 0 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--accent);
  }
  #memlist {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-height: 150px;
    overflow-y: auto;
  }
  #memlist li { display: flex; gap: 9px; align-items: baseline; font-size: 12px; }
  #memlist .kind {
    font-family: Consolas, monospace;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    min-width: 70px;
  }
  #memlist button {
    margin-left: auto;
    padding: 1px 7px;
    font-size: 10px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
  }
  #memlist button:hover { color: #fca5a5; border-color: rgba(252, 165, 165, .5); }

  /* ---------- aprovações ---------- */
  .approvals {
    border: 1px solid rgba(251, 191, 36, .45);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(251, 191, 36, .08), var(--panel));
    padding: 10px 14px 12px;
  }
  .approvals-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: Consolas, "SF Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #fbbf24;
  }
  #approvalcount {
    padding: 0 7px;
    border: 1px solid rgba(251, 191, 36, .45);
    border-radius: 999px;
    color: #fbbf24;
  }
  .approval { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .approval-title { font-size: 12.5px; color: var(--ink); }
  .approval-detail {
    margin: 0;
    max-height: 150px;
    overflow: auto;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(0, 0, 0, .28);
    font-family: Consolas, "SF Mono", monospace;
    font-size: 10.5px;
    line-height: 1.5;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .approval-actions { display: flex; gap: 8px; }
  .approval-actions button {
    padding: 4px 12px;
    font-size: 11px;
    border-radius: 7px;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--muted);
  }
  .approval-actions .approve {
    border-color: rgba(52, 211, 153, .55);
    color: #34d399;
  }
  .approval-actions .approve:hover { background: rgba(52, 211, 153, .12); }
  .approval-actions .reject:hover { color: #fca5a5; border-color: rgba(252, 165, 165, .5); }
  .approval-actions button:disabled { opacity: .45; cursor: default; }

  /* ---------- rodapé ---------- */
  .composer { display: flex; gap: 10px; }
  form { flex: 1; display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(6, 16, 25, .8);
    color: var(--ink);
    font: inherit;
    letter-spacing: .01em;
  }
  input[type="text"]::placeholder { color: #3f6274; }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--line-strong);
    box-shadow: 0 0 0 1px rgba(34, 211, 238, .18), 0 0 22px rgba(34, 211, 238, .10);
  }
  button {
    font-family: Consolas, "SF Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(6, 16, 25, .8);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 18px;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  button:hover { border-color: var(--line-strong); color: #fff; }
  button.primary {
    color: #04121a;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 700;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.voice[aria-pressed="true"] {
    color: #04121a;
    background: var(--accent);
    border-color: var(--accent);
  }
  .voice { min-width: 120px; }

  @media (max-width: 880px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .reactor { min-height: 240px; }
  }
</style>
</head>
<body data-status="parado">
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">◈</span>NOX</div>
    <div class="clock" id="clock">--:--:--</div>
    <button class="emergency" id="emergency" aria-pressed="false" title="Parar o controlo do PC">Parar</button>
    <div class="status" id="status"><i></i><span id="statustext">parado</span></div>
  </header>

  <main class="stage">
    <section class="reactor">
      <canvas id="spectrum"></canvas>
      <div class="core">
        <div class="core-title">NOX</div>
        <div class="core-sub">local · pt-PT</div>
      </div>
    </section>

    <aside class="side">
      <div class="panel-head">Conversa</div>
      <div class="log" id="log">
        <div class="empty">Diz «Hey Nox» ou escreve em baixo.</div>
      </div>
      <div class="approvals" id="approvals" hidden>
        <div class="approvals-head"><span>Aprovação necessária</span><span id="approvalcount"></span></div>
        <div id="approvallist"></div>
      </div>
      <details class="memory" id="memory">
        <summary>Memória <span id="memcount">0</span></summary>
        <ul id="memlist"></ul>
      </details>
    </aside>
  </main>

  <footer class="composer">
    <form id="form">
      <input id="text" type="text" autocomplete="off" placeholder="Escreve ao Nox…" autofocus>
      <button class="primary" type="submit">Enviar</button>
    </form>
    <button class="voice" id="voice" aria-pressed="false">Ouvir</button>
  </footer>
</div>

<script>
const BANDS = 48;
const canvas = document.getElementById("spectrum");
const ctx = canvas.getContext("2d");
const logEl = document.getElementById("log");
const statusText = document.getElementById("statustext");
const voiceBtn = document.getElementById("voice");
const emergencyBtn = document.getElementById("emergency");
const clockEl = document.getElementById("clock");
const memList = document.getElementById("memlist");
const memCount = document.getElementById("memcount");
const approvalsEl = document.getElementById("approvals");
const approvalList = document.getElementById("approvallist");
const approvalCount = document.getElementById("approvalcount");

let target = new Array(BANDS).fill(0);
let current = new Array(BANDS).fill(0);
let inputTarget = new Array(BANDS).fill(0);
let inputCurrent = new Array(BANDS).fill(0);
let status = "parado";
let rendered = -1;
let phase = 0;
let approvalKey = "";
let emergencyOn = false;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

function tick() {
  clockEl.textContent = new Date().toLocaleTimeString("pt-PT", { hour12: false });
}
setInterval(tick, 1000);
tick();

function render(turns) {
  if (turns.length === rendered) return;
  rendered = turns.length;
  logEl.innerHTML = "";
  if (!turns.length) {
    logEl.innerHTML = '<div class="empty">Diz «Hey Nox» ou escreve em baixo.</div>';
    return;
  }
  for (const turn of turns) {
    const wrap = document.createElement("div");
    wrap.className = "turn " + turn.role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = turn.role === "user" ? "tu" : "nox";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = turn.text;
    wrap.append(who, bubble);
    logEl.append(wrap);
  }
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(value) {
  if (value === status) return;
  status = value;
  document.body.dataset.status = value;
  statusText.textContent = value;
}

function setEmergency(on) {
  if (on === emergencyOn) return;
  emergencyOn = on;
  emergencyBtn.setAttribute("aria-pressed", String(on));
  emergencyBtn.textContent = on ? "Retomar" : "Parar";
  document.body.dataset.emergency = on ? "on" : "off";
}

async function toggleEmergency() {
  try {
    const data = await api("/api/emergency", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: !emergencyOn }),
    });
    setEmergency(Boolean(data.emergency));
  } catch (error) {
    /* sem ligação: o próximo refresh repõe o estado */
  }
}
emergencyBtn.addEventListener("click", toggleEmergency);

async function decideApproval(id, approved, button) {
  button.disabled = true;
  try {
    await api("/api/approvals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, approved }),
    });
  } catch (error) {
    /* o pedido pode ter expirado; o próximo refresh limpa o painel */
  }
  approvalKey = "";
  refresh();
}

function renderApprovals(items) {
  const key = items.map((item) => item.id).join(",");
  if (key === approvalKey) return;
  approvalKey = key;
  approvalsEl.hidden = items.length === 0;
  approvalCount.textContent = items.length ? String(items.length) : "";
  approvalList.innerHTML = "";
  for (const item of items) {
    const card = document.createElement("div");
    card.className = "approval";
    const title = document.createElement("div");
    title.className = "approval-title";
    title.textContent = item.summary;
    const detail = document.createElement("pre");
    detail.className = "approval-detail";
    detail.textContent = item.detail || item.action;
    const actions = document.createElement("div");
    actions.className = "approval-actions";
    const yes = document.createElement("button");
    yes.className = "approve";
    yes.textContent = "Aprovar";
    yes.onclick = () => decideApproval(item.id, true, yes);
    const no = document.createElement("button");
    no.className = "reject";
    no.textContent = "Recusar";
    no.onclick = () => decideApproval(item.id, false, no);
    actions.append(yes, no);
    card.append(title, detail, actions);
    approvalList.append(card);
  }
}

async function refresh() {
  try {
    const state = await api("/api/state");
    setStatus(state.status);
    voiceBtn.setAttribute("aria-pressed", String(state.voice));
    voiceBtn.textContent = state.voice ? "Parar" : "Ouvir";
    render(state.turns);
    renderApprovals(state.approvals || []);
    setEmergency(Boolean(state.emergency));
  } catch (error) {
    setStatus("sem ligação");
  }
}

async function refreshLevels() {
  try {
    const data = await api("/api/levels");
    if (Array.isArray(data.levels) && data.levels.length === BANDS) {
      target = data.levels;
    }
    if (Array.isArray(data.input) && data.input.length === BANDS) {
      inputTarget = data.input;
    }
    setStatus(data.status);
  } catch (error) {
    /* a animação continua com o último valor */
  }
  setTimeout(refreshLevels, 90);
}

async function refreshMemory() {
  try {
    const data = await api("/api/memory");
    memCount.textContent = data.facts.length;
    memList.innerHTML = "";
    if (!data.facts.length) {
      const item = document.createElement("li");
      item.style.color = "var(--muted)";
      item.textContent = "Ainda não sei nada. Diz «chamo-me …» ou «lembra-te que …».";
      memList.append(item);
      return;
    }
    for (const fact of data.facts) {
      const item = document.createElement("li");
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = fact.kind;
      const text = document.createElement("span");
      text.textContent = fact.text;
      const forget = document.createElement("button");
      forget.textContent = "esquecer";
      forget.addEventListener("click", async () => {
        await api("/api/memory/forget", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pattern: fact.text })
        });
        refreshMemory();
      });
      item.append(kind, text, forget);
      memList.append(item);
    }
  } catch (error) {
    /* silencioso: a memória não é crítica para a conversa */
  }
}

/* ---------- reactor ---------- */
function resize() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * ratio));
  canvas.height = Math.max(1, Math.floor(rect.height * ratio));
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
window.addEventListener("resize", resize);

function ring(cx, cy, radius, width, alpha, dash, rotation) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.beginPath();
  ctx.setLineDash(dash);
  ctx.lineWidth = width;
  ctx.strokeStyle = "rgba(34, 211, 238, " + alpha + ")";
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.min(w, h) * 0.5;
  const base = radius * 0.60;
  phase += 0.006;

  const glow = ctx.createRadialGradient(cx, cy, base * 0.2, cx, cy, radius);
  glow.addColorStop(0, "rgba(34, 211, 238, 0.12)");
  glow.addColorStop(0.55, "rgba(34, 211, 238, 0.04)");
  glow.addColorStop(1, "rgba(4, 7, 13, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  ring(cx, cy, base * 1.30, 1, 0.10, [2, 10], phase * 0.35);
  ring(cx, cy, base * 1.16, 1, 0.16, [30, 8], -phase * 0.5);
  ring(cx, cy, base * 0.88, 1, 0.14, [], 0);

  ctx.save();
  ctx.translate(cx, cy);
  for (let i = 0; i < 72; i += 1) {
    const angle = (i / 72) * Math.PI * 2;
    const inner = base * 1.16;
    const outer = inner + (i % 6 === 0 ? 9 : 4);
    ctx.beginPath();
    ctx.strokeStyle = "rgba(34, 211, 238, " + (i % 6 === 0 ? 0.16 : 0.06) + ")";
    ctx.lineWidth = 1;
    ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
    ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
    ctx.stroke();
  }
  ctx.restore();

  const idle = 0.045 + 0.03 * Math.sin(phase * 2.2);
  const speaking = target.some((value) => value > 0.02);
  const listening = inputTarget.some((value) => value > 0.02);

  for (let i = 0; i < BANDS; i += 1) {
    // Espelhado no eixo vertical: meia volta mostra o espectro, a outra metade
    // repete-o. É o que dá o desenho simétrico em vez de um gráfico torto.
    const band = i < BANDS / 2 ? i : BANDS - 1 - i;
    const value = speaking
      ? current[band]
      : idle * (0.6 + 0.4 * Math.sin(phase * 1.6 + band * 0.42));
    const angle = (i / BANDS) * Math.PI * 2 - Math.PI / 2;
    const inner = base * 1.02;
    const length = 5 + value * base * 0.62;
    const x1 = cx + Math.cos(angle) * inner;
    const y1 = cy + Math.sin(angle) * inner;
    const x2 = cx + Math.cos(angle) * (inner + length);
    const y2 = cy + Math.sin(angle) * (inner + length);

    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(34, 211, 238, " + (0.06 + value * 0.22) + ")";
    ctx.lineWidth = 7;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = "rgba(165, 243, 252, " + (0.35 + value * 0.65) + ")";
    ctx.lineWidth = 2;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Anel interior: o microfone. Verde, a crescer para dentro, para não se
  // confundir com a voz do Nox.
  ring(cx, cy, base * 0.80, 1, listening ? 0.22 : 0.08, [], 0);
  for (let i = 0; i < BANDS; i += 1) {
    const band = i < BANDS / 2 ? i : BANDS - 1 - i;
    const value = listening ? inputCurrent[band] : 0;
    if (value < 0.01) continue;
    const angle = (i / BANDS) * Math.PI * 2 - Math.PI / 2;
    const outer = base * 0.80;
    const length = 4 + value * base * 0.34;
    const x1 = cx + Math.cos(angle) * outer;
    const y1 = cy + Math.sin(angle) * outer;
    const x2 = cx + Math.cos(angle) * (outer - length);
    const y2 = cy + Math.sin(angle) * (outer - length);

    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(52, 211, 153, " + (0.10 + value * 0.30) + ")";
    ctx.lineWidth = 6;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = "rgba(167, 243, 208, " + (0.35 + value * 0.65) + ")";
    ctx.lineWidth = 2;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  for (let i = 0; i < BANDS; i += 1) {
    current[i] += (target[i] - current[i]) * 0.28;
    inputCurrent[i] += (inputTarget[i] - inputCurrent[i]) * 0.38;
  }
  requestAnimationFrame(draw);
}

document.getElementById("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try {
    await api("/api/say", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
  } catch (error) {
    console.error(error);
  }
  refresh();
  refreshMemory();
});

voiceBtn.addEventListener("click", async () => {
  const on = voiceBtn.getAttribute("aria-pressed") !== "true";
  await api("/api/voice", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ on })
  });
  refresh();
});

resize();
draw();
refresh();
refreshMemory();
refreshLevels();
setInterval(refresh, 900);
setInterval(refreshMemory, 2500);
</script>
