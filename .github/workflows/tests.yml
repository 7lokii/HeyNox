name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar projeto
        # `audio` traz o numpy, que o denoise/voiceprint importam no topo. As
        # restantes dependências (vosk, faster-whisper, piper) são lazy e os
        # testes que precisam delas saltam sozinhos.
        run: pip install -e ".[audio,dev]"
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Testes
        run: pytest --cov=nox --cov-report=term-missing
